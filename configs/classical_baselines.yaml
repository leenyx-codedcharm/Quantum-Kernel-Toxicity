dataset_key: herg_karim
feature_dir: data/processed/features/hERG_Karim
split_file: data/splits/herg_karim_scaffold.json
output_root: results/classical_baselines/herg_karim
prediction_root: results/herg_karim
seed: 42
n_jobs: 4
split_names:
  - scaffold_r0
  - scaffold_r1
  - scaffold_r2
  - scaffold_r3
  - scaffold_r4
tuning:
  selection_metric: validation_auroc
  decision_threshold_metric: validation_balanced_accuracy
  confidence_level: 0.95
  ci_method: t_interval_over_repeats
  forest:
    - {n_estimators: 300, max_features: sqrt, min_samples_leaf: 1}
    - {n_estimators: 300, max_features: 0.5, min_samples_leaf: 1}
    - {n_estimators: 300, max_features: sqrt, min_samples_leaf: 2}
    - {n_estimators: 500, max_features: 0.5, min_samples_leaf: 2}
  lightgbm:
    - {n_estimators: 300, num_leaves: 15, learning_rate: 0.05, min_child_samples: 20, reg_lambda: 1.0}
    - {n_estimators: 300, num_leaves: 31, learning_rate: 0.05, min_child_samples: 20, reg_lambda: 1.0}
    - {n_estimators: 500, num_leaves: 15, learning_rate: 0.03, min_child_samples: 20, reg_lambda: 1.0}
    - {n_estimators: 500, num_leaves: 31, learning_rate: 0.03, min_child_samples: 40, reg_lambda: 5.0}
  tanimoto_svm:
    c_values: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
    class_weights: [null, balanced]
    probability_calibration: stratified_5fold_oof_margins_and_logistic_regression
    calibration_folds: 5
    calibration_logistic_c: 1.0
    cache_size_mb: 512
    kernel_block_size: 256
    max_kernel_memory_mb: 3072
pilot:
  enabled_by_flag: true
  source_split: scaffold_r0
  source_partition: train
  sample_size: 768
  train_size: 512
  validation_size: 128
  holdout_size: 128
  candidates_per_track: 1
  output_name: pilot_scaffold_r0
